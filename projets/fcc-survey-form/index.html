<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form - FreeCodeCamp</title>
    <meta name="description" content="Formulaire d'enquête responsive - Projet FreeCodeCamp">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="title">Survey Form</h1>
            <p id="description">Merci de prendre le temps de remplir ce formulaire</p>
        </header>
        
        <form id="survey-form">
            <!-- Informations personnelles -->
            <div class="form-group">
                <label for="name" id="name-label">Nom</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="Entrez votre nom"
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="email" id="email-label">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Entrez votre email"
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="number" id="number-label">Âge (optionnel)</label>
                <input 
                    type="number" 
                    id="number" 
                    name="age" 
                    min="13" 
                    max="120"
                    placeholder="Âge"
                >
            </div>
            
            <!-- Dropdown -->
            <div class="form-group">
                <label for="dropdown">Quel rôle décrit le mieux votre situation actuelle ?</label>
                <select id="dropdown" name="role" required>
                    <option value="" disabled selected>Sélectionnez une option</option>
                    <option value="student">Étudiant</option>
                    <option value="job">Emploi à temps plein</option>
                    <option value="learner">Apprenant</option>
                    <option value="preferNo">Je préfère ne pas dire</option>
                    <option value="other">Autre</option>
                </select>
            </div>
            
            <!-- Radio buttons -->
            <div class="form-group">
                <p>Recommanderiez-vous FreeCodeCamp à un ami ?</p>
                <label class="radio-label">
                    <input 
                        type="radio" 
                        name="user-recommend" 
                        value="definitely"
                        checked
                    >
                    Définitivement
                </label>
                <label class="radio-label">
                    <input 
                        type="radio" 
                        name="user-recommend" 
                        value="maybe"
                    >
                    Peut-être
                </label>
                <label class="radio-label">
                    <input 
                        type="radio" 
                        name="user-recommend" 
                        value="not-sure"
                    >
                    Pas sûr
                </label>
            </div>
            
            <!-- Checkboxes -->
            <div class="form-group">
                <p>Qu'aimeriez-vous voir amélioré ? (cochez tout ce qui s'applique)</p>
                <label class="checkbox-label">
                    <input type="checkbox" value="front-end" class="user-checkbox">
                    Projets Front-end
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" value="back-end" class="user-checkbox">
                    Projets Back-end
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" value="data-viz" class="user-checkbox">
                    Visualisation de données
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" value="challenges" class="user-checkbox">
                    Challenges
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" value="community" class="user-checkbox">
                    Communauté open source
                </label>
            </div>
            
            <!-- Textarea -->
            <div class="form-group">
                <label for="comments">Commentaires ou suggestions</label>
                <textarea 
                    id="comments" 
                    name="comments" 
                    placeholder="Entrez vos commentaires ici..."
                    rows="5"
                ></textarea>
            </div>
            
            <!-- Submit button -->
            <button type="submit" id="submit">Envoyer</button>
        </form>
        
        <footer>
            <p><a href="../index.html">← Retour aux projets</a></p>
        </footer>
    </div>
    
    <!-- FreeCodeCamp Test Suite -->
    <!-- Décommentez pour tester avec la suite de tests FreeCodeCamp -->
    <!-- <script src="https://cdn.freecodecamp.org/testable-projects-fcc/v1/bundle.js"></script> -->
</body>
</html>
