<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App - FreeCodeCamp</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <!-- header -->
        <div id="header">
            <div>
                <h1 id="location"></h1>
                <p id="main-temperature"></p>
            </div>
            <div>
                <div>
                    <img id="weather-icon" src="https://cdn.freecodecamp.org/weather-icons/01n.png" alt="Weather Icon">
                    <h2 id="weather-main">Clear</h2>
                </div>
                <p id="feels-like">Feels like 13°C</p>
            </div>
        </div>

        <!-- wind -->
        <div id="wind-section">
            <p id="humidity">Humidity: 80%</p>
            <div>
                <p id="wind-gust">Wind Gust: 10 km/h</p>
                <p id="wind">Wind: 5 km/h</p>
            </div>
        </div>
        <!-- search -->
        <div id="search-section">
            <p>Choose a city:</p>
            <select id="city-select">
                <option value=""></option>
                <option value="paris">Paris</option>
                <option value="london">London</option>
                <option value="tokyo">Tokyo</option>
                <option value="los angeles">Los Angeles</option>
                <option value="chicago">Chicago</option>
                <option value="new york">New York</option>
            </select>
            <button id="get-weather-btn">Get Weather</button>
        </div>




    </main>

    <script src="script.js"></script>
</body>

</html>
